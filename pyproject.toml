[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjwtguard"
version = "1.0.0"
description = "Zero-dependency hardened JWT and JWS verification for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pyjwtguard contributors" }]
keywords = ["jwt", "jws", "security", "algorithm-confusion", "token"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
pyjwtguard = "pyjwtguard.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pyjwtguard"
Repository = "https://github.com/draarivpatel-ui/pyjwtguard"
Issues = "https://github.com/draarivpatel-ui/pyjwtguard/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyjwtguard = ["py.typed"]
